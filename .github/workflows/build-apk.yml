name: Build Arcane Arena APK
on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: "ArcaneArena_Mobile_Android ex/ArcaneArena"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ArcaneArena-apk
          path: "ArcaneArena_Mobile_Android ex/ArcaneArena/app/build/outputs/apk/debug/app-debug.apk"
